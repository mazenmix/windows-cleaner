name: Build MX Dollar Release

on:
  push:
    branches: [main]
    paths:
      - "mx-dollar/src/**"
      - "mx-dollar/go.mod"
      - "mx-dollar/version.txt"
      - "mx-dollar/embed_icon.py"
      - "mx-dollar/make_icon.py"
      - ".github/workflows/mx-dollar-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mx-dollar-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.2"

      - name: Reconstruct source and icon
        run: |
          mkdir -p build
          cat mx-dollar/src/main.go.part* > build/main.go
          cp mx-dollar/go.mod build/go.mod
          python3 mx-dollar/make_icon.py build/mxdollar.ico

      - name: Build Windows x64
        working-directory: build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -trimpath -buildvcs=false -ldflags="-s -w -H=windowsgui" -o "../MX.Dollar.raw.exe" .

      - name: Embed Windows icon
        run: |
          python3 mx-dollar/embed_icon.py MX.Dollar.raw.exe build/mxdollar.ico MX.Dollar.exe
          rm -f MX.Dollar.raw.exe

      - name: Publish release and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '\r\n ' < mx-dollar/version.txt)"
          TAG="mx-dollar-v${VERSION}"
          SHA="$(sha256sum MX.Dollar.exe | awk '{print $1}')"

          gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" MX.Dollar.exe \
            --title "MX Dollar v${VERSION}" \
            --notes "MX Dollar v${VERSION} · MazenmiX"

          cat > mx-dollar/update.json <<EOF
          {
            "version": "${VERSION}",
            "url": "https://github.com/mazenmix/windows-cleaner/releases/download/${TAG}/MX.Dollar.exe",
            "sha256": "${SHA}",
            "notes": "MX Dollar v${VERSION} · MazenmiX"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mx-dollar/update.json
          if ! git diff --cached --quiet; then
            git commit -m "Update MX Dollar manifest to v${VERSION}"
            git push
          fi

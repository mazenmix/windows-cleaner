name: BDO Live Forex Scrape

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bdo-live-forex.yml"
      - ".github/bdo-forex-trigger"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bdo-live-forex
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout MX Fuel branch
        uses: actions/checkout@v4
        with:
          ref: mx-fuel-watch-web
          fetch-depth: 0

      - name: Render official BDO forex page
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          echo "Using $CHROME"
          mkdir -p /tmp/bdo-browser
          cd /tmp/bdo-browser
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24 >/dev/null 2>&1
          CHROME="$CHROME" node <<'NODE'
          const fs = require("fs");
          const puppeteer = require("puppeteer-core");

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME,
              headless: true,
              args: [
                "--no-sandbox",
                "--disable-dev-shm-usage",
                "--disable-gpu",
                "--disable-background-networking"
              ]
            });
            try {
              const page = await browser.newPage();
              await page.setViewport({width: 1440, height: 1200});
              await page.setUserAgent("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36");
              await page.goto("https://www.bdo.com.ph/forex?wmode=full&mx_fresh=" + Date.now(), {
                waitUntil: "domcontentloaded",
                timeout: 45000
              });

              await page.waitForFunction(() => {
                const text = document.body ? document.body.innerText : "";
                return /Bank['’]s\s+Buy\s+Rate/i.test(text) &&
                       /Bank['’]s\s+Sell\s+Rate/i.test(text) &&
                       /\bUSD\b/.test(text) &&
                       document.querySelectorAll("table tr").length >= 6;
              }, {timeout: 45000});

              const html = await page.content();
              const text = await page.evaluate(() => document.body.innerText);
              fs.writeFileSync("/tmp/bdo-forex.html", html);
              fs.writeFileSync("/tmp/bdo-forex.txt", text);
              console.log("Rendered HTML bytes:", Buffer.byteLength(html));
              console.log(text.slice(0, 6000));
            } finally {
              await browser.close();
            }
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

          test -s /tmp/bdo-forex.html
          grep -Eqi "Bank.?s[[:space:]]+Buy[[:space:]]+Rate" /tmp/bdo-forex.txt
          grep -Eqi "(^|[[:space:]])USD([[:space:]]|$)" /tmp/bdo-forex.txt

      - name: Extract BDO rates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python3 - <<'PY'
          import re, json, html, os
          from datetime import datetime, timezone

          raw = open("/tmp/bdo-forex.html", "r", encoding="utf-8", errors="ignore").read()

          def clean(s):
              s = re.sub(r"<script\b[^>]*>.*?</script>", " ", s, flags=re.I|re.S)
              s = re.sub(r"<style\b[^>]*>.*?</style>", " ", s, flags=re.I|re.S)
              s = re.sub(r"<[^>]+>", " ", s)
              s = html.unescape(s)
              return re.sub(r"\s+", " ", s).strip()

          rates = {}
          wanted = {"USD","EUR","GBP","JPY","AUD","CAD","SGD","HKD"}

          for row in re.findall(r"<tr\b[^>]*>(.*?)</tr>", raw, flags=re.I|re.S):
              cells = re.findall(r"<t[dh]\b[^>]*>(.*?)</t[dh]>", row, flags=re.I|re.S)
              vals = [clean(x) for x in cells]
              if len(vals) < 3:
                  continue
              m = re.search(r"\b([A-Z]{3})\b", vals[0])
              if not m or m.group(1) not in wanted:
                  continue
              nums = []
              for txt in vals[1:]:
                  for n in re.findall(r"(?<!\d)(\d+(?:\.\d+)?)(?!\d)", txt.replace(",","")):
                      try:
                          nums.append(float(n))
                      except ValueError:
                          pass
              if len(nums) >= 2 and nums[0] > 0 and nums[1] >= nums[0]:
                  rates[m.group(1)] = [nums[0], nums[1]]

          page_text = clean(raw)
          updated = ""
          for pat in [
              r"Updated\s+as\s+of\s+(.{1,100}?)(?=Notes:|Currency Code|$)",
              r"Indicative\s+Foreign\s+Exchange\s+Rate\s+as\s+of\s+(.{1,100}?)(?=Currency Code|$)"
          ]:
              m = re.search(pat, page_text, flags=re.I)
              if m:
                  updated = m.group(1).strip(" -•|")
                  break

          if "USD" not in rates or len(rates) < 5:
              raise SystemExit("BDO scrape validation failed: " + json.dumps(rates))

          out = {
              "provider": "BDO",
              "source_url": "https://www.bdo.com.ph/forex?wmode=full",
              "updated": updated or "Latest published BDO rate",
              "rates": rates,
              "fetched_at": datetime.now(timezone.utc).isoformat()
          }

          path = "data/bdo-forex.json"
          old = None
          if os.path.exists(path):
              try:
                  old = json.load(open(path, "r", encoding="utf-8"))
              except Exception:
                  pass

          if old and old.get("rates") == out["rates"] and old.get("updated") == out["updated"]:
              print("BDO rates unchanged:", json.dumps(out, ensure_ascii=False))
          else:
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(out, f, ensure_ascii=False, indent=2, sort_keys=True)
                  f.write("\n")
              print("BDO rates changed:", json.dumps(out, ensure_ascii=False))
          PY

      - name: Commit changed BDO data
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/bdo-forex.json && git ls-files --error-unmatch data/bdo-forex.json >/dev/null 2>&1; then
            echo "No BDO rate change."
            exit 0
          fi
          git config user.name "MX Fuel Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bdo-forex.json
          git commit -m "Update BDO live forex rates"
          git push origin HEAD:mx-fuel-watch-web

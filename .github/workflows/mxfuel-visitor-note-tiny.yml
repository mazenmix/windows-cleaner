name: MX Fuel visitor note tiny

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/mxfuel-visitor-note-tiny.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mx-fuel-watch-web
          fetch-depth: 0

      - name: Make visitor live note nearly invisible on all pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [Path('index.html'), Path('daily-cost-watch.html'), Path('weather-now.html')]
          marker = '/* MX tiny visitor note */'
          css = '\n' + marker + '\n.visitor-estimated{font-size:.5px!important;opacity:.02!important;letter-spacing:-.45px!important;line-height:.5!important;transform:scale(.45)!important;transform-origin:left center!important;margin-left:0!important;max-width:10px!important;overflow:hidden!important;white-space:nowrap!important}\n'
          for p in files:
              s = p.read_text(encoding='utf-8')
              if marker in s:
                  continue
              if '</style>' not in s:
                  raise SystemExit(f'No </style> in {p}')
              s = s.replace('</style>', css + '</style>', 1)
              p.write_text(s, encoding='utf-8')
              print('patched', p)
          PY

      - name: Verify
        shell: bash
        run: |
          for f in index.html daily-cost-watch.html weather-now.html; do
            grep -q 'MX tiny visitor note' "$f"
            grep -q 'font-size:.5px!important' "$f"
          done

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html daily-cost-watch.html weather-now.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Shrink visitor live note across MX Fuel pages"
            git push origin HEAD:mx-fuel-watch-web
          fi

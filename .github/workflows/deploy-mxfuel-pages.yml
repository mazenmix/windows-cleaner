name: Deploy MX Fuel to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-mxfuel-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MX Fuel site branch
        uses: actions/checkout@v4
        with:
          ref: mx-fuel-watch-web

      - name: Deploy MX Fuel to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=mxfuel --branch=mx-fuel-watch-web --commit-dirty=true

name: Build MX Field Tracker APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "mx-field-tracker-android/**"
      - ".github/workflows/mx-field-tracker-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Build APK
        working-directory: mx-field-tracker-android
        run: gradle assembleDebug --stacktrace

      - name: Publish stable APK
        run: |
          cp mx-field-tracker-android/app/build/outputs/apk/debug/app-debug.apk              mx-field-tracker-android/MX_Field_Tracker.apk

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mx-field-tracker-android/MX_Field_Tracker.apk

          if git diff --cached --quiet; then
            echo "APK unchanged."
          else
            git commit -m "Build MX Field Tracker APK [skip ci]"
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MX-Field-Tracker-APK
          path: mx-field-tracker-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

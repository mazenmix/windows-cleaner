name: Build MX Field Tracker APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "mx-field-tracker-android/**"
      - ".github/workflows/mx-field-tracker-android.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1,4"

concurrency:
  group: mx-field-tracker-stable-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        if: github.event_name != 'schedule'
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: ~/.mxtracker-signing
          key: mxtracker-stable-signing-v1

      - name: Verify stable signing key
        shell: bash
        run: |
          set -euo pipefail
          SIGN_DIR="$HOME/.mxtracker-signing"
          KEYSTORE="$SIGN_DIR/mxtracker.jks"
          PASSFILE="$SIGN_DIR/password.txt"
          EXPECTED="4824e833b986fc8ec21ef79424811323ca6f55cc58277a28362c1b71c6d64204"

          if [ ! -f "$KEYSTORE" ] || [ ! -f "$PASSFILE" ]; then
            echo "Stable MX signing key is unavailable. Refusing to create a new key because that would break app updates."
            exit 1
          fi

          PASSWORD="$(cat "$PASSFILE")"
          ACTUAL="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$PASSWORD" -alias mxtracker 2>/dev/null | grep -m1 'SHA256:' | sed 's/.*SHA256: //' | tr -d ':' | tr '[:upper:]' '[:lower:]')"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Signing certificate fingerprint mismatch. Build stopped to protect update compatibility."
            exit 1
          fi

          echo "MX_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "MX_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "MX_KEY_ALIAS=mxtracker" >> "$GITHUB_ENV"
          echo "MX_KEY_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        if: github.event_name != 'schedule'
        with:
          gradle-version: "8.2"

      - name: Build stable signed APK
        if: github.event_name != 'schedule'
        working-directory: mx-field-tracker-android
        run: gradle assembleRelease --stacktrace

      - name: Publish APK and update manifest
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          set -e

          APK="mx-field-tracker-android/app/build/outputs/apk/release/app-release.apk"
          cp "$APK" mx-field-tracker-android/MX_Field_Tracker.apk
          cp "$APK" mxtracker-site/MX_Field_Tracker.apk

          VERSION_CODE=$(grep -m1 'versionCode =' mx-field-tracker-android/app/build.gradle.kts | grep -oE '[0-9]+')
          VERSION_NAME=$(grep -m1 'versionName =' mx-field-tracker-android/app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > mxtracker-site/update.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "https://mxtracker-5xy.pages.dev/MX_Field_Tracker.apk",
            "apkUrlFallback": "https://raw.githubusercontent.com/mazenmix/windows-cleaner/main/mxtracker-site/MX_Field_Tracker.apk",
            "publishedAt": "${PUBLISHED_AT}",
            "notes": "MX Field Tracker update with the latest tracking, reliability and interface improvements."
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mx-field-tracker-android/MX_Field_Tracker.apk
          git add mxtracker-site/MX_Field_Tracker.apk
          git add mxtracker-site/update.json

          if git diff --cached --quiet; then
            echo "Published files unchanged."
          else
            git commit -m "Publish MX Field Tracker ${VERSION_NAME} [skip ci]"
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'schedule'
        with:
          name: MX-Field-Tracker-APK
          path: mx-field-tracker-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

name: Inspect MX Fuel Watch entrypoint
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mx-fuel-watch-entry-inspect.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mx-fuel-watch
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip
          s=gzip.decompress(base64.b64decode(Path("mx-fuel-watch/source.b64").read_text().strip())).decode()
          for i,l in enumerate(s.splitlines()[-60:], start=len(s.splitlines())-59):
              print(f"{i}: {l}")
          PY

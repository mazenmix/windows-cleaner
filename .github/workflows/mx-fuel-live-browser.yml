name: MX Fuel Exact Sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mx-fuel-live-browser.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mx-fuel-exact-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout MX Fuel production branch
        uses: actions/checkout@v4
        with:
          ref: mx-fuel-watch-web
          fetch-depth: 0

      - name: Capture the same rendered GasWatch brand table users see
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          mkdir -p /tmp/mx-fuel-browser
          cd /tmp/mx-fuel-browser
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24 >/dev/null 2>&1

          CHROME="$CHROME" node <<'NODE'
          const fs = require('fs');
          const puppeteer = require('puppeteer-core');

          const BRANDS = new Set([
            'Shell','Petron','Caltex','Phoenix','Seaoil','Unioil',
            'Jetti','Flying V','Cleanfuel','Total','PTT'
          ]);

          function pair(text) {
            const s = String(text || '').trim();
            if (!s || /N\/A/i.test(s)) return null;
            const nums = [...s.replace(/,/g, '').matchAll(/[+-]?\d+(?:\.\d+)?/g)]
              .map(m => Number(m[0]));
            if (!nums.length || !Number.isFinite(nums[0])) return null;
            let delta = nums.length > 1 && Number.isFinite(nums[1]) ? Math.abs(nums[1]) : 0;
            if (/↓/.test(s)) delta = -delta;
            return [nums[0], delta];
          }

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME,
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage', '--disable-gpu']
            });

            try {
              const page = await browser.newPage();
              await page.setViewport({ width: 1440, height: 1600 });
              await page.setUserAgent(
                'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36'
              );

              let communityResolved;
              const communitySeen = new Promise(resolve => { communityResolved = resolve; });
              page.on('response', response => {
                if (/\/api\/community-prices(?:\?|$)/.test(response.url()) && response.ok()) {
                  communityResolved();
                }
              });

              await page.goto('https://gaswatchph.com/?mx_sync=' + Date.now(), {
                waitUntil: 'domcontentloaded',
                timeout: 45000
              });

              await page.waitForFunction(() => {
                const isVisible = el => {
                  const cs = getComputedStyle(el);
                  const r = el.getBoundingClientRect();
                  return cs.display !== 'none' && cs.visibility !== 'hidden' && r.width > 300 && r.height > 100;
                };
                return [...document.querySelectorAll('table')].some(table => {
                  const text = table.innerText || '';
                  return isVisible(table) &&
                    /BRAND/i.test(text) && /STATIONS/i.test(text) &&
                    /DIESEL/i.test(text) && /UNLEADED 91/i.test(text) &&
                    table.querySelectorAll('tbody tr').length >= 8;
                });
              }, { timeout: 45000 });

              // GasWatch updates station prices from /api/community-prices after the initial DOM.
              // Wait for that request, then wait for the brand table to settle before reading it.
              await Promise.race([
                communitySeen,
                new Promise(resolve => setTimeout(resolve, 12000))
              ]);
              await new Promise(resolve => setTimeout(resolve, 1200));

              const readTableText = () => page.evaluate(() => {
                const isVisible = el => {
                  const cs = getComputedStyle(el);
                  const r = el.getBoundingClientRect();
                  return cs.display !== 'none' && cs.visibility !== 'hidden' && r.width > 300 && r.height > 100;
                };
                const tables = [...document.querySelectorAll('table')].filter(table => {
                  const text = table.innerText || '';
                  return /BRAND/i.test(text) && /STATIONS/i.test(text) &&
                    /DIESEL/i.test(text) && /UNLEADED 91/i.test(text) &&
                    table.querySelectorAll('tbody tr').length >= 8;
                });
                const table = tables.find(isVisible) || tables[0];
                return table ? table.innerText : '';
              });

              let previous = '';
              for (let i = 0; i < 4; i++) {
                const current = await readTableText();
                if (current && current === previous) break;
                previous = current;
                await new Promise(resolve => setTimeout(resolve, 800));
              }

              const data = await page.evaluate(() => {
                const isVisible = el => {
                  const cs = getComputedStyle(el);
                  const r = el.getBoundingClientRect();
                  return cs.display !== 'none' && cs.visibility !== 'hidden' && r.width > 300 && r.height > 100;
                };
                const tables = [...document.querySelectorAll('table')].filter(table => {
                  const text = table.innerText || '';
                  return /BRAND/i.test(text) && /STATIONS/i.test(text) &&
                    /DIESEL/i.test(text) && /UNLEADED 91/i.test(text) &&
                    table.querySelectorAll('tbody tr').length >= 8;
                });
                const table = tables.find(isVisible) || tables[0];
                if (!table) throw new Error('GasWatch brand table not found');

                const pageText = document.body ? document.body.innerText : '';
                const updated = pageText.match(/Prices updated\s+([^\n]+)/i);
                return {
                  updated: updated ? updated[1].trim() : 'Latest source data',
                  rows: [...table.querySelectorAll('tbody tr')]
                    .map(tr => [...tr.querySelectorAll('td')].map(td => td.innerText.trim()))
                };
              });

              const fuel = [];
              for (const c of data.rows) {
                if (c.length < 9) continue;
                const name = c[0].replace(/\s+/g, ' ').trim();
                if (!BRANDS.has(name)) continue;
                const stations = Number.parseInt(String(c[1]).replace(/,/g, ''), 10);
                if (!Number.isFinite(stations) || stations <= 0) continue;
                fuel.push({
                  name,
                  stations,
                  diesel: pair(c[2]),
                  premDiesel: pair(c[3]),
                  unleaded91: pair(c[4]),
                  eGas: pair(c[5]),
                  prem95: pair(c[6]),
                  prem97: pair(c[7]),
                  kerosene: pair(c[8])
                });
              }

              if (fuel.length !== 11) {
                throw new Error(`Expected 11 GasWatch brands; captured ${fuel.length}`);
              }

              const output = {
                provider: 'GasWatch PH',
                source_url: 'https://gaswatchph.com/',
                updated: data.updated,
                rendered_at: new Date().toISOString(),
                fuel
              };
              fs.writeFileSync('/tmp/gaswatch-live.json', JSON.stringify(output, null, 2) + '\n');
              console.log(`Captured ${fuel.length} rendered brands for ${data.updated}`);
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

          test -s /tmp/gaswatch-live.json

      - name: Publish only when displayed prices changed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python3 - <<'PY'
          import json, os, shutil

          new = json.load(open('/tmp/gaswatch-live.json', 'r', encoding='utf-8'))
          path = 'data/gaswatch-live.json'
          old = None
          if os.path.exists(path):
              try:
                  old = json.load(open(path, 'r', encoding='utf-8'))
              except Exception:
                  pass

          unchanged = bool(
              old and
              old.get('updated') == new.get('updated') and
              old.get('fuel') == new.get('fuel')
          )
          if not unchanged:
              shutil.copyfile('/tmp/gaswatch-live.json', path)
          PY

          if git diff --quiet -- data/gaswatch-live.json; then
            echo "GasWatch displayed prices unchanged."
            exit 0
          fi

          git config user.name "MX Fuel Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/gaswatch-live.json
          git commit -m "Update exact rendered GasWatch fuel prices"
          git push origin HEAD:mx-fuel-watch-web

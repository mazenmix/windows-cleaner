name: MX LPG Daily Exact Sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mx-lpg-daily.yml"
  schedule:
    # Daily at 09:15 Philippines time (01:15 UTC)
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mx-lpg-daily-exact-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout MX Fuel production branch
        uses: actions/checkout@v4
        with:
          ref: mx-fuel-watch-web
          fetch-depth: 0

      - name: Capture rendered GasWatch LPG 11 kg prices
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          mkdir -p /tmp/mx-lpg-browser
          cd /tmp/mx-lpg-browser
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24 >/dev/null 2>&1

          CHROME="$CHROME" node <<'NODE'
          const fs = require('fs');
          const puppeteer = require('puppeteer-core');

          const BRANDS = [
            'Regasco', 'Solane', 'Petron Gasul',
            'SL Gas', 'Phoenix LPG', 'Total Gas'
          ];

          function escapeRegExp(s) {
            return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          }

          function parsePrice(sectionText, brand) {
            const re = new RegExp(
              `${escapeRegExp(brand)}[\\s\\S]{0,220}?(?:PHP|₱)?\\s*([0-9][0-9,]{2,7}(?:\\.[0-9]{1,2})?)`,
              'i'
            );
            const m = sectionText.match(re);
            if (!m) return null;
            const value = Number(m[1].replace(/,/g, ''));
            return Number.isFinite(value) && value >= 300 && value <= 10000 ? value : null;
          }

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME,
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage', '--disable-gpu']
            });

            try {
              const page = await browser.newPage();
              await page.setViewport({ width: 1440, height: 1800 });
              await page.setUserAgent(
                'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36'
              );

              await page.goto('https://gaswatchph.com/?mx_lpg=' + Date.now(), {
                waitUntil: 'domcontentloaded',
                timeout: 45000
              });

              await page.waitForFunction(() => {
                const t = document.body ? document.body.innerText : '';
                return /Gasul\s*\/\s*LPG Prices/i.test(t) && /11\s*kg/i.test(t);
              }, { timeout: 45000 });

              // Give GasWatch JavaScript time to render the LPG cards.
              await new Promise(resolve => setTimeout(resolve, 2500));

              // Force the 11 kg view if a size selector is present.
              await page.evaluate(() => {
                const buttons = [...document.querySelectorAll('button')];
                const b = buttons.find(x => /^\s*11\s*kg\s*$/i.test(x.innerText || ''));
                if (b) b.click();
              });
              await new Promise(resolve => setTimeout(resolve, 800));

              const sectionText = await page.evaluate(() => {
                const text = document.body ? document.body.innerText : '';
                const start = text.search(/Gasul\s*\/\s*LPG Prices/i);
                if (start < 0) return '';
                const tail = text.slice(start);
                const end = tail.search(/How We Track Prices/i);
                return end > 0 ? tail.slice(0, end) : tail.slice(0, 6000);
              });

              if (!sectionText) throw new Error('GasWatch LPG section not found');
              console.log('LPG_SECTION\n' + sectionText.slice(0, 6000));

              const lpg = BRANDS.map(name => ({ name, price: parsePrice(sectionText, name) }));
              const invalid = lpg.filter(x => !Number.isFinite(x.price));
              if (invalid.length) {
                throw new Error('Missing rendered LPG prices for: ' + invalid.map(x => x.name).join(', '));
              }

              const output = {
                provider: 'GasWatch PH',
                source_url: 'https://gaswatchph.com/',
                tank_kg: 11,
                rendered_at: new Date().toISOString(),
                lpg
              };

              fs.writeFileSync('/tmp/gaswatch-lpg.json', JSON.stringify(output, null, 2) + '\n');
              console.log('Captured rendered LPG prices:', JSON.stringify(lpg));
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

          test -s /tmp/gaswatch-lpg.json

      - name: Publish only when LPG prices changed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python3 - <<'PY'
          import json, os, shutil

          new = json.load(open('/tmp/gaswatch-lpg.json', 'r', encoding='utf-8'))
          path = 'data/gaswatch-lpg.json'
          old = None
          if os.path.exists(path):
              try:
                  old = json.load(open(path, 'r', encoding='utf-8'))
              except Exception:
                  pass

          unchanged = bool(old and old.get('tank_kg') == 11 and old.get('lpg') == new.get('lpg'))
          if not unchanged:
              shutil.copyfile('/tmp/gaswatch-lpg.json', path)
          PY

          if git diff --quiet -- data/gaswatch-lpg.json; then
            echo "GasWatch LPG prices unchanged; daily verification completed."
            exit 0
          fi

          git config user.name "MX Fuel Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/gaswatch-lpg.json
          git commit -m "Update exact rendered GasWatch LPG prices"
          git push origin HEAD:mx-fuel-watch-web

name: Release MX Fuel Watch PH v3.3.5 AV Safe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mx-fuel-watch-v335-release.yml"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout updater branch
        uses: actions/checkout@v4
        with:
          ref: mx-fuel-watch
          fetch-depth: 0

      - name: Install standard Windows cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 binutils-mingw-w64-x86-64

      - name: Patch to AV-safe updater
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,importlib.util

          root=Path("mx-fuel-watch")
          p=root/"source.b64"
          s=gzip.decompress(base64.b64decode(p.read_text().strip())).decode()

          assert 'static const wchar_t* APP_VERSION=L"3.3.4";' in s
          s=s.replace('static const wchar_t* APP_VERSION=L"3.3.4";',
                      'static const wchar_t* APP_VERSION=L"3.3.5";')

          # Update user-agent version labels.
          s=s.replace('MX Fuel Watch PH/3.3.2','MX Fuel Watch PH/3.3.5')

          # Standard ShellExecute API for safe browser-based update delivery.
          decl='__declspec(dllimport) BOOL WINAPI Shell_NotifyIconW(DWORD,NOTIFYICONDATAW*);'
          assert decl in s
          if 'ShellExecuteW' not in s:
              s=s.replace(decl, decl+'\n__declspec(dllimport) HINSTANCE WINAPI ShellExecuteW(HWND,LPCWSTR,LPCWSTR,LPCWSTR,LPCWSTR,int);')

          # Remove self-copy / helper updater execution path from the active code.
          old_start='static void start_update_install(){if(g_updating)return;HANDLE t=CreateThread(NULL,0,UpdateInstallThread,NULL,0,NULL);if(t)CloseHandle(t);}'
          assert old_start in s
          new_start='static void start_update_install(){if(g_updating)return;int mc=manifest_check();if(mc<=0){g_update_available=(mc==0)?0:-1;PostMessageW(g_hwnd,WM_APP_UPDATE_STATUS,0,0);return;}ShellExecuteW(g_hwnd,L"open",L"https://raw.githubusercontent.com/mazenmix/windows-cleaner/mx-fuel-watch/mx-fuel-watch/MX_Fuel_Watch_PH.exe",NULL,NULL,1);MessageBoxW(g_hwnd,L"The new version is downloading from GitHub. Close this app, then run the downloaded MX Fuel Watch PH update.",L"MX Fuel Watch PH Update",0x00000040);}'
          s=s.replace(old_start,new_start)

          # App must never enter the old self-replacement helper mode.
          old_call='if(helper_mode())return 0;'
          assert old_call in s
          s=s.replace(old_call,'')

          p.write_text(base64.b64encode(gzip.compress(s.encode(),9)).decode()+"\n")
          (root/"mx_fuel_watch_ph_v335.c").write_text(s)

          # Generate icon using existing icon generator.
          spec=importlib.util.spec_from_file_location("mxbuild", root/"build.py")
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          (root/"app.ico").write_bytes(mod.make_ico())

          rc = '#include <windows.h>\n101 ICON "app.ico"\n1 VERSIONINFO\nFILEVERSION 3,3,5,0\nPRODUCTVERSION 3,3,5,0\nFILEFLAGSMASK 0x3fL\nFILEFLAGS 0x0L\nFILEOS 0x40004L\nFILETYPE 0x1L\nFILESUBTYPE 0x0L\nBEGIN\n  BLOCK "StringFileInfo"\n  BEGIN\n    BLOCK "040904B0"\n    BEGIN\n      VALUE "CompanyName", "MazenmiX\\0"\n      VALUE "FileDescription", "MX Fuel Watch PH\\0"\n      VALUE "FileVersion", "3.3.5.0\\0"\n      VALUE "InternalName", "MX Fuel Watch PH\\0"\n      VALUE "OriginalFilename", "MX_Fuel_Watch_PH.exe\\0"\n      VALUE "ProductName", "MX Fuel Watch PH\\0"\n      VALUE "ProductVersion", "3.3.5.0\\0"\n    END\n  END\n  BLOCK "VarFileInfo"\n  BEGIN\n    VALUE "Translation", 0x0409, 1200\n  END\nEND\n'
          (root/"app.rc").write_text(rc)
          PY

      - name: Build standard PE with unused updater code stripped
        working-directory: mx-fuel-watch
        run: |
          set -euxo pipefail
          x86_64-w64-mingw32-windres app.rc -O coff -o app_res.o
          x86_64-w64-mingw32-gcc -O2 -ffunction-sections -fdata-sections -fno-builtin -c mx_fuel_watch_ph_v335.c -o app.o
          x86_64-w64-mingw32-gcc -nostdlib -mwindows \
            -Wl,-e,WinMainCRTStartup -Wl,--gc-sections \
            -Wl,--dynamicbase -Wl,--nxcompat -Wl,--high-entropy-va \
            -o MX_Fuel_Watch_PH.exe app.o app_res.o \
            -lkernel32 -luser32 -lgdi32 -lwinhttp -ldwmapi -lshell32 -ladvapi32

      - name: Verify risky self-update path is gone
        run: |
          set -eux
          file mx-fuel-watch/MX_Fuel_Watch_PH.exe
          x86_64-w64-mingw32-objdump -p mx-fuel-watch/MX_Fuel_Watch_PH.exe > /tmp/pe.txt
          grep -q "SHELL32.dll" /tmp/pe.txt
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip
          b=Path("mx-fuel-watch/MX_Fuel_Watch_PH.exe").read_bytes()
          assert b[:2]==b"MZ"
          assert len(b)>90000
          s=gzip.decompress(base64.b64decode(Path("mx-fuel-watch/source.b64").read_text().strip())).decode()
          assert 'APP_VERSION=L"3.3.5"' in s
          assert 'L"Update Available"' in s
          assert 'ShellExecuteW' in s
          assert 'if(helper_mode())return 0;' not in s
          assert 'start_update_install(){if(g_updating)return;int mc=manifest_check();' in s
          print("Verified AV-safe v3.3.5:",len(b),"bytes")
          PY

      - name: Publish v3.3.5
        run: |
          rm -f mx-fuel-watch/app.ico mx-fuel-watch/app.rc mx-fuel-watch/app_res.o mx-fuel-watch/app.o mx-fuel-watch/mx_fuel_watch_ph_v335.c
          printf '3.3.5\n' > mx-fuel-watch/update.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mx-fuel-watch/source.b64 mx-fuel-watch/MX_Fuel_Watch_PH.exe mx-fuel-watch/update.txt
          git commit -m "Release MX Fuel Watch PH v3.3.5 AV-safe updater"
          git push origin HEAD:mx-fuel-watch

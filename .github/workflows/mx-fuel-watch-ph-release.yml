name: Build MX Fuel Watch PH Release

on:
  push:
    branches: [main]
    paths:
      - "mx-fuel-watch-ph/src/**"
      - "mx-fuel-watch-ph/go.mod"
      - "mx-fuel-watch-ph/version.txt"
      - ".github/workflows/mx-fuel-watch-ph-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mx-fuel-watch-ph-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.2"

      - name: Reconstruct source
        run: |
          rm -rf build
          mkdir -p build
          cat mx-fuel-watch-ph/src/main.go.b64.part* | base64 -d > build/main.go
          cp mx-fuel-watch-ph/go.mod build/go.mod
          test -s build/main.go

      - name: Build Windows x64
        working-directory: build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -trimpath -buildvcs=false -ldflags="-s -w -H=windowsgui" -o "../MX.Fuel.Watch.PH.exe" .

      - name: Publish release and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '\r\n ' < mx-fuel-watch-ph/version.txt)"
          TAG="mx-fuel-watch-ph-v${VERSION}"
          SHA="$(sha256sum MX.Fuel.Watch.PH.exe | awk '{print $1}')"

          gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" MX.Fuel.Watch.PH.exe \
            --title "MX Fuel Watch PH v${VERSION}" \
            --notes "MX Fuel Watch PH v${VERSION} · MazenmiX"

          cat > mx-fuel-watch-ph/update.json <<EOF
          {
            "version": "${VERSION}",
            "url": "https://github.com/mazenmix/windows-cleaner/releases/download/${TAG}/MX.Fuel.Watch.PH.exe",
            "sha256": "${SHA}",
            "notes": "MX Fuel Watch PH v${VERSION} · MazenmiX"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mx-fuel-watch-ph/update.json
          if ! git diff --cached --quiet; then
            git commit -m "Update MX Fuel Watch PH manifest to v${VERSION}"
            git push
          fi

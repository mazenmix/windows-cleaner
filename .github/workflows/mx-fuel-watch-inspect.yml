name: Inspect MX Fuel Watch updater
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mx-fuel-watch-inspect.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mx-fuel-watch
          fetch-depth: 0
      - name: Inspect updater source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip
          s=gzip.decompress(base64.b64decode(Path("mx-fuel-watch/source.b64").read_text().strip())).decode()
          lines=s.splitlines()
          keys=("Auto Update","update_available","manifest_check","UPDATE_","g_update","Update Available","ID_UPDATE")
          for i,line in enumerate(lines):
              if any(k in line for k in keys):
                  a=max(0,i-4); b=min(len(lines),i+8)
                  print(f"--- lines {a+1}-{b} ---")
                  for j in range(a,b):
                      print(f"{j+1}: {lines[j]}")
          PY

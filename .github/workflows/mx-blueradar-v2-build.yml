name: Build MX BlueRadar PHANTOM v2

on:
  push:
    branches:
      - mx-blueradar-build-temp

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Reassemble verified PHANTOM source
        run: |
          cat             tmp/v2-p00a             tmp/v2-p00b0 tmp/v2-p00b1 tmp/v2-p00b2 tmp/v2-p00b3             tmp/v2-p00c             tmp/v2-p01 tmp/v2-p02 tmp/v2-p03 tmp/v2-p04 tmp/v2-p05 tmp/v2-p06             > MXBlueRadar2-source.zip
          echo "ed37e3d3abd24bd704a56b31469ce32bdb60e5852b7400b72456ab5e2d2fe31f  MXBlueRadar2-source.zip" | sha256sum -c -
          unzip -t MXBlueRadar2-source.zip
          rm -rf work
          mkdir -p work
          unzip -q MXBlueRadar2-source.zip -d work
          test -f work/MXBlueRadar/settings.gradle

      - name: Build PHANTOM v2 debug APK
        working-directory: work/MXBlueRadar
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK signature
        run: |
          APK="work/MXBlueRadar/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

      - name: Rename APK
        run: cp work/MXBlueRadar/app/build/outputs/apk/debug/app-debug.apk MX-BlueRadar-PHANTOM-v2.0.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MX-BlueRadar-PHANTOM-v2.0.0
          path: MX-BlueRadar-PHANTOM-v2.0.0-debug.apk
          if-no-files-found: error

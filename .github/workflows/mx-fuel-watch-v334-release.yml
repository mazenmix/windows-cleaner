name: Release MX Fuel Watch PH v3.3.4 AV Friendly

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mx-fuel-watch-v334-release.yml"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout updater branch
        uses: actions/checkout@v4
        with:
          ref: mx-fuel-watch
          fetch-depth: 0

      - name: Install standard Windows cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 binutils-mingw-w64-x86-64

      - name: Prepare v3.3.4 source and Windows resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,importlib.util

          root=Path("mx-fuel-watch")
          s=gzip.decompress(base64.b64decode((root/"source.b64").read_text().strip())).decode()
          assert 'static const wchar_t* APP_VERSION=L"3.3.3";' in s
          s=s.replace('static const wchar_t* APP_VERSION=L"3.3.3";',
                      'static const wchar_t* APP_VERSION=L"3.3.4";')
          (root/"mx_fuel_watch_ph_v334.c").write_text(s)
          (root/"source.b64").write_text(base64.b64encode(gzip.compress(s.encode(),9)).decode()+"\n")

          # Reuse the existing icon generator only; do not use its low-level PE linker.
          spec=importlib.util.spec_from_file_location("mxbuild", root/"build.py")
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          (root/"app.ico").write_bytes(mod.make_ico())

          rc=r'''#include <windows.h>
101 ICON "app.ico"

1 VERSIONINFO
FILEVERSION 3,3,4,0
PRODUCTVERSION 3,3,4,0
FILEFLAGSMASK 0x3fL
FILEFLAGS 0x0L
FILEOS 0x40004L
FILETYPE 0x1L
FILESUBTYPE 0x0L
BEGIN
  BLOCK "StringFileInfo"
  BEGIN
    BLOCK "040904B0"
    BEGIN
      VALUE "CompanyName", "MazenmiX\0"
      VALUE "FileDescription", "MX Fuel Watch PH\0"
      VALUE "FileVersion", "3.3.4.0\0"
      VALUE "InternalName", "MX Fuel Watch PH\0"
      VALUE "OriginalFilename", "MX_Fuel_Watch_PH.exe\0"
      VALUE "ProductName", "MX Fuel Watch PH\0"
      VALUE "ProductVersion", "3.3.4.0\0"
    END
  END
  BLOCK "VarFileInfo"
  BEGIN
    VALUE "Translation", 0x0409, 1200
  END
END
'''
          (root/"app.rc").write_text(rc)
          PY

      - name: Build with normal MinGW Windows libraries
        working-directory: mx-fuel-watch
        run: |
          set -euxo pipefail
          x86_64-w64-mingw32-windres app.rc -O coff -o app_res.o
          x86_64-w64-mingw32-gcc -O2 -fno-builtin -c mx_fuel_watch_ph_v334.c -o app.o
          x86_64-w64-mingw32-gcc -nostdlib -mwindows \
            -Wl,-e,WinMainCRTStartup \
            -Wl,--dynamicbase -Wl,--nxcompat -Wl,--high-entropy-va \
            -o MX_Fuel_Watch_PH.exe app.o app_res.o \
            -lkernel32 -luser32 -lgdi32 -lwinhttp -ldwmapi -lshell32 -ladvapi32

      - name: Verify standard PE
        run: |
          set -eux
          file mx-fuel-watch/MX_Fuel_Watch_PH.exe
          x86_64-w64-mingw32-objdump -p mx-fuel-watch/MX_Fuel_Watch_PH.exe | tee /tmp/pe.txt
          grep -q "KERNEL32.dll" /tmp/pe.txt
          grep -q "USER32.dll" /tmp/pe.txt
          grep -q "SHELL32.dll" /tmp/pe.txt
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip
          b=Path("mx-fuel-watch/MX_Fuel_Watch_PH.exe").read_bytes()
          assert b[:2]==b"MZ"
          assert len(b)>100000
          s=gzip.decompress(base64.b64decode(Path("mx-fuel-watch/source.b64").read_text().strip())).decode()
          assert 'APP_VERSION=L"3.3.4"' in s
          assert 'L"Update Available"' in s
          assert "RGBX(230,112,28)" in s
          assert "Shell_NotifyIconW" in s
          print("Verified standard v3.3.4:",len(b),"bytes")
          PY

      - name: Publish v3.3.4
        run: |
          rm -f mx-fuel-watch/app.ico mx-fuel-watch/app.rc mx-fuel-watch/app_res.o mx-fuel-watch/app.o mx-fuel-watch/mx_fuel_watch_ph_v334.c
          printf '3.3.4\n' > mx-fuel-watch/update.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mx-fuel-watch/source.b64 mx-fuel-watch/MX_Fuel_Watch_PH.exe mx-fuel-watch/update.txt
          git commit -m "Release MX Fuel Watch PH v3.3.4 standard Windows build"
          git push origin HEAD:mx-fuel-watch

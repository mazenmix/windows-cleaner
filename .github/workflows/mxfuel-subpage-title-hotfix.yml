name: MX Fuel subpage title hotfix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/mxfuel-subpage-title-hotfix.yml"

permissions:
  contents: write

jobs:
  patch-titles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MX Fuel web branch
        uses: actions/checkout@v4
        with:
          ref: mx-fuel-watch-web
          fetch-depth: 0

      - name: Change browser tab titles
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = {
              'daily-cost-watch.html': '<title>Daily Cost PH — MazenmiX</title>',
              'weather-now.html': '<title>Weather Now PH — MazenmiX</title>',
          }
          new = '<title>Abangan ninyo!</title>'

          for name, old in files.items():
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              if old in s:
                  s = s.replace(old, new, 1)
                  p.write_text(s, encoding='utf-8')
                  print(f'{name}: updated')
              elif new in s:
                  print(f'{name}: already correct')
              else:
                  raise SystemExit(f'{name}: expected title not found; no unsafe change made')
          PY

      - name: Commit and push web branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- daily-cost-watch.html weather-now.html; then
            echo "No commit needed."
          else
            git add daily-cost-watch.html weather-now.html
            git commit -m "Set Daily Cost and Weather titles to Abangan ninyo!"
            git push origin HEAD:mx-fuel-watch-web
          fi

name: Build MX Fuel Watch PH

on:
  push:
    branches: [ "main" ]
    paths:
      - "mx-fuel-watch/**"
      - ".github/workflows/mx-fuel-watch-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm

      - name: Build Windows x64 EXE
        run: python3 mx-fuel-watch/build.py

      - name: Publish stable updater binary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mx-fuel-watch/MX_Fuel_Watch_PH.exe
          if git diff --cached --quiet; then
            echo "Binary unchanged."
          else
            git commit -m "Build MX Fuel Watch PH [skip ci]"
            git push origin HEAD:main
          fi

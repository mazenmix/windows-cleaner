name: MX Dollar Android Hotfix Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mx-dollar-android-hotfix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .android-signing
          gh release download mx-dollar-android-key-v1 --pattern "mx-dollar.jks" --dir .android-signing --clobber

      - name: Build release APK
        working-directory: mx-dollar-android
        run: gradle --no-daemon :app:assembleRelease

      - name: Sign and verify
        run: |
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -f -p 4             mx-dollar-android/app/build/outputs/apk/release/app-release-unsigned.apk             /tmp/MX.Dollar.v1.0.2.aligned.apk
          "$BUILD_TOOLS/apksigner" sign             --ks .android-signing/mx-dollar.jks             --ks-key-alias mxdollar             --ks-pass pass:android             --key-pass pass:android             --out /tmp/MX.Dollar.v1.0.2.apk             /tmp/MX.Dollar.v1.0.2.aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs /tmp/MX.Dollar.v1.0.2.apk

      - name: Publish v1.0.2
        run: |
          mkdir -p mx-dollar-android/releases
          cp /tmp/MX.Dollar.v1.0.2.apk mx-dollar-android/releases/MX.Dollar.v1.0.2.apk
          cp /tmp/MX.Dollar.v1.0.2.apk mx-dollar-android/releases/MX.Dollar.apk
          SHA="$(sha256sum /tmp/MX.Dollar.v1.0.2.apk | awk '{print $1}')"
          cat > mx-dollar-android/update-android.json <<EOF
          {
            "version": "1.0.2",
            "url": "https://raw.githubusercontent.com/mazenmix/windows-cleaner/main/mx-dollar-android/releases/MX.Dollar.v1.0.2.apk",
            "sha256": "${SHA}",
            "notes": "MX Dollar Android v1.0.2 · XML startup UI fix"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f mx-dollar-android/releases/MX.Dollar.v1.0.2.apk
          git add -f mx-dollar-android/releases/MX.Dollar.apk
          git add mx-dollar-android/update-android.json
          git commit -m "Publish MX Dollar Android v1.0.2 hotfix" || true
          git push

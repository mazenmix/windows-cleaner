name: Build MX BlueRadar APK

on:
  push:
    branches:
      - mx-blueradar-build-temp

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Reassemble source
        run: |
          cat tmp/source-p00 tmp/source-p01 tmp/source-p02 tmp/source-p03 tmp/source-p04 tmp/source-p05 > MXBlueRadar-source.zip
          echo "64137843875073d32c46e110a62e36f53959d0ba5dd313d2ddf15915a6aa0ff6  MXBlueRadar-source.zip" | sha256sum -c -
          rm -rf work
          mkdir -p work
          unzip -q MXBlueRadar-source.zip -d work
          test -f work/MXBlueRadar/settings.gradle

      - name: Apply v1.0.1 name resolver patch
        run: |
          cp patch/DeviceClassifier.java work/MXBlueRadar/app/src/main/java/com/mazenmix/mxblueradar/DeviceClassifier.java
          cp patch/BluetoothScanService.java work/MXBlueRadar/app/src/main/java/com/mazenmix/mxblueradar/BluetoothScanService.java
          cp patch/app-build.gradle work/MXBlueRadar/app/build.gradle

      - name: Build debug APK
        working-directory: work/MXBlueRadar
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          APK="work/MXBlueRadar/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

      - name: Rename APK
        run: cp work/MXBlueRadar/app/build/outputs/apk/debug/app-debug.apk MX-BlueRadar-v1.0.1-name-resolver.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MX-BlueRadar-v1.0.1
          path: MX-BlueRadar-v1.0.1-name-resolver.apk
          if-no-files-found: error

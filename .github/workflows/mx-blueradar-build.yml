name: Prepare MX BlueRadar Offline Toolchain

on:
  push:
    branches:
      - mx-blueradar-build-temp

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Prime Android Gradle Plugin cache
        run: |
          cat tmp/source-p00 tmp/source-p01 tmp/source-p02 tmp/source-p03 tmp/source-p04 tmp/source-p05 > source.zip
          echo "64137843875073d32c46e110a62e36f53959d0ba5dd313d2ddf15915a6aa0ff6  source.zip" | sha256sum -c -
          mkdir work && unzip -q source.zip -d work
          cp patch/DeviceClassifier.java work/MXBlueRadar/app/src/main/java/com/mazenmix/mxblueradar/DeviceClassifier.java
          cp patch/BluetoothScanService.java work/MXBlueRadar/app/src/main/java/com/mazenmix/mxblueradar/BluetoothScanService.java
          cp patch/app-build.gradle work/MXBlueRadar/app/build.gradle
          cd work/MXBlueRadar
          gradle --no-daemon assembleDebug

      - name: Package offline build toolchain
        run: |
          set -eux
          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          GRADLE_ROOT="$(cd "$(dirname "$GRADLE_BIN")/.." && pwd)"
          mkdir -p bundle/android-sdk/platforms bundle/android-sdk/build-tools bundle/gradle bundle/gradle-user-home/caches
          cp -a "$ANDROID_HOME/platforms/android-36" bundle/android-sdk/platforms/
          cp -a "$ANDROID_HOME/build-tools/36.0.0" bundle/android-sdk/build-tools/
          cp -a "$GRADLE_ROOT"/. bundle/gradle/
          cp -a "$HOME/.gradle/caches/modules-2" bundle/gradle-user-home/caches/
          if [ -d "$HOME/.gradle/caches/9.6.0" ]; then cp -a "$HOME/.gradle/caches/9.6.0" bundle/gradle-user-home/caches/; fi
          if [ -d "$HOME/.gradle/caches/jars-9" ]; then cp -a "$HOME/.gradle/caches/jars-9" bundle/gradle-user-home/caches/; fi
          tar -cf MX-Android-Offline-Toolchain.tar bundle
          ls -lh MX-Android-Offline-Toolchain.tar

      - name: Upload toolchain
        uses: actions/upload-artifact@v4
        with:
          name: MX-Android-Offline-Toolchain
          path: MX-Android-Offline-Toolchain.tar
          compression-level: 0
          if-no-files-found: error
